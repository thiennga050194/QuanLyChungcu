<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Quản Lý Chung Cư</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #000;
        }

        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
        }

        #play-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(241, 3, 3, 0.3);
            display: none;
        }

        .login-container {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 10;
            width: 90%;
            max-width: 280px;
            padding: 10px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .login-card h2 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #fff;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.8);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 14px;
            user-select: none;
            opacity: 0.7;
            z-index: 5;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            background: #4a6fa5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .error-message {
            color: #d32f2f;
            background: #ffebee;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>

    <video autoplay muted loop playsinline id="video-background">
        <source src="/video/4.mp4" type="video/mp4">
    </video>

    <div class="login-container">
        <div class="login-card">
            <h2>🔑 ĐĂNG NHẬP</h2>
            <div id="errorBox" class="error-message"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" class="form-control" id="username" placeholder="Nhập username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                        <span id="togglePassword" class="toggle-password">👁️</span>
                    </div>
                </div>
                <button type="submit" class="btn-primary">ĐĂNG NHẬP</button>
            </form>
        </div>
    </div>

    <script src="/js/api-client.js"></script>
    <script>
        const errorBox = document.getElementById('errorBox');
        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = this.querySelector('button');
            
            try {
                btn.disabled = true;
                btn.textContent = 'ĐANG XỬ LÝ...';
                
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.accessToken);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('role', data.role);
                    
                    if (data.role === 'ROLE_ADMIN') {
                        window.location.href = '/quanly.html';
                    } else {
                        window.location.href = '/nhanvien.html';
                    }
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    errorBox.textContent = errorData.message || 'Tên đăng nhập hoặc mật khẩu không chính xác!';
                    if (errorData.error) console.error('Chi tiết lỗi:', errorData.error);
                    errorBox.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'ĐĂNG NHẬP';
                }
            } catch (error) {
                console.error('Lỗi đăng nhập:', error);
                errorBox.textContent = 'Lỗi kết nối máy chủ!';
                errorBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'ĐĂNG NHẬP';
            }
        });

        // Toggle password
        document.getElementById('togglePassword').addEventListener('click', function() {
            const password = document.getElementById('password');
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🕶️';
        });

        // Video background handler
        (function() {
            const video = document.getElementById('video-background');
            video.play().catch(() => {
                console.log('Autoplay blocked');
            });
        })();
    </script>
</body>
</html>
